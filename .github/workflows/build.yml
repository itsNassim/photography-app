name: Build PhotoStudioApp

# Builds the app and the Inno Setup installer on a real, free GitHub-hosted
# Windows runner - no Visual Studio or Inno Setup install needed on your own
# PC. Trigger it by pushing to main/master, or manually from the Actions tab
# ("Run workflow" button, thanks to workflow_dispatch below).
#
# This version does NOT use "nuget restore" (it proved flaky in CI for
# packages.config-style projects). Instead it downloads the exact
# Stub.System.Data.SQLite.Core.NetFramework NuGet package directly from
# nuget.org and unpacks it into the "packages" folder the .csproj's
# <HintPath> expects - fully deterministic, no dependency on nuget.exe's
# restore behavior. (System.Data.SQLite.Core itself is an empty meta-package
# as of 1.0.116+ - the real assets live in the Stub package instead.)
#
# It also locates PhotoStudioApp.sln and installer\PhotoStudioApp.iss
# wherever they actually are in the repo, so an extra nesting level from a
# drag-and-drop upload doesn't break anything.
#
# When the run finishes (a couple of minutes), open it from the Actions tab
# and scroll down to "Artifacts" - you'll find:
#   - PhotoStudioApp-Installer  -> contains PhotoStudioApp-Setup.exe
#   - PhotoStudioApp-Portable   -> the raw bin\Release folder (xcopy build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Locate project files
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path . -Filter "PhotoStudioApp.sln" -Recurse | Select-Object -First 1
          if (-not $sln) {
            Write-Host "Repository contents (for debugging):"
            Get-ChildItem -Path . -Recurse -Depth 3 | ForEach-Object { Write-Host $_.FullName }
            throw "Could not find PhotoStudioApp.sln anywhere in the repository."
          }

          $iss = Get-ChildItem -Path . -Filter "PhotoStudioApp.iss" -Recurse | Select-Object -First 1
          if (-not $iss) {
            throw "Found PhotoStudioApp.sln at $($sln.FullName) but could not find installer\PhotoStudioApp.iss anywhere in the repository."
          }

          $csproj = Get-ChildItem -Path . -Filter "PhotoStudioApp.csproj" -Recurse | Select-Object -First 1
          if (-not $csproj) {
            throw "Could not find PhotoStudioApp.csproj anywhere in the repository."
          }

          Write-Host "Found solution:  $($sln.FullName)"
          Write-Host "Found project:   $($csproj.FullName)"
          Write-Host "Found installer: $($iss.FullName)"

          "SLN_PATH=$($sln.FullName)"       | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ISS_PATH=$($iss.FullName)"       | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SOLUTION_DIR=$($sln.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore Microsoft.NETFramework.ReferenceAssemblies.net46 (direct download, not a system-wide devpack install)
        shell: pwsh
        run: |
          # This is Microsoft's own officially documented fix for "reference assemblies for
          # .NETFramework,Version=v4.6 were not found" (MSB3644) on machines that don't have
          # the exact matching Developer Pack installed - see
          # https://learn.microsoft.com/dotnet/framework/migration-guide/reference-assemblies
          # windows-latest's bundled VS only ships the 4.7.2/4.8 targeting packs. We tried
          # "choco install netfx-4.6-devpack" first, but it did not reliably take effect
          # before the build step ran - this package-based approach is fully deterministic
          # (just files on disk, no installer/registry/reboot involved) and is the same
          # direct-download-and-extract pattern already used for the SQLite package below.
          $pkgId = "Microsoft.NETFramework.ReferenceAssemblies.net46"
          $pkgVersion = "1.0.3"
          $packagesDir = Join-Path $env:SOLUTION_DIR "packages"
          $pkgDir = Join-Path $packagesDir "$pkgId.$pkgVersion"
          $expectedRefDir = Join-Path $pkgDir "build\.NETFramework\v4.6"
          $expectedMscorlib = Join-Path $expectedRefDir "mscorlib.dll"
          $expectedWinforms = Join-Path $expectedRefDir "System.Windows.Forms.dll"

          New-Item -ItemType Directory -Force -Path $packagesDir | Out-Null
          $zipPath = Join-Path $env:RUNNER_TEMP "$pkgId.$pkgVersion.nupkg.zip"

          Write-Host "Downloading $pkgId $pkgVersion from nuget.org ..."
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/$pkgId/$pkgVersion" -OutFile $zipPath -UseBasicParsing

          Write-Host "Extracting into $pkgDir ..."
          Expand-Archive -Path $zipPath -DestinationPath $pkgDir -Force

          Write-Host "Package contents:"
          Get-ChildItem -Recurse $pkgDir | Select-Object -First 60 | ForEach-Object { Write-Host $_.FullName }

          if (-not (Test-Path $expectedMscorlib) -or -not (Test-Path $expectedWinforms)) {
            Write-Host "Full package contents (for debugging):"
            Get-ChildItem -Recurse $pkgDir | ForEach-Object { Write-Host $_.FullName }
            throw "Downloaded the package but did not find mscorlib.dll / System.Windows.Forms.dll under $expectedRefDir - PhotoStudioApp.csproj's NetFx46RefAssembliesPackageDir may need updating to match the real layout."
          }
          Write-Host "OK - found reference assemblies under $expectedRefDir (including mscorlib.dll and System.Windows.Forms.dll)"

      - name: Restore Stub.System.Data.SQLite.Core.NetFramework (direct download, not nuget restore)
        shell: pwsh
        run: |
          # NOTE: "System.Data.SQLite.Core" is an empty meta-package as of 1.0.116+ -
          # the real .NET Framework assets (managed DLL + native SQLite.Interop.dll)
          # live in this package instead. See PhotoStudioApp.csproj for the matching
          # Reference/HintPath and the CopySQLiteInteropFilesOurselves target.
          $pkgId = "Stub.System.Data.SQLite.Core.NetFramework"
          $pkgVersion = "1.0.118"
          $packagesDir = Join-Path $env:SOLUTION_DIR "packages"
          $pkgDir = Join-Path $packagesDir "$pkgId.$pkgVersion"
          $expectedDll = Join-Path $pkgDir "lib\net46\System.Data.SQLite.dll"
          $expectedInteropX86 = Join-Path $pkgDir "build\net46\x86\SQLite.Interop.dll"
          $expectedInteropX64 = Join-Path $pkgDir "build\net46\x64\SQLite.Interop.dll"

          New-Item -ItemType Directory -Force -Path $packagesDir | Out-Null
          $zipPath = Join-Path $env:RUNNER_TEMP "$pkgId.$pkgVersion.nupkg.zip"

          Write-Host "Downloading $pkgId $pkgVersion from nuget.org ..."
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/$pkgId/$pkgVersion" -OutFile $zipPath -UseBasicParsing

          Write-Host "Extracting into $pkgDir ..."
          Expand-Archive -Path $zipPath -DestinationPath $pkgDir -Force

          Write-Host "Package contents:"
          Get-ChildItem -Recurse $pkgDir | ForEach-Object { Write-Host $_.FullName }

          if (-not (Test-Path $expectedDll)) {
            throw "Downloaded the package but did not find the expected DLL at $expectedDll. See the file listing above - PhotoStudioApp.csproj's HintPath may need updating to match the real layout."
          }
          Write-Host "OK - found managed DLL at $expectedDll"

          if (-not (Test-Path $expectedInteropX86) -and -not (Test-Path $expectedInteropX64)) {
            Write-Warning "Did not find SQLite.Interop.dll under build\net46\x86 or x64 - see file listing above. The app will fail at runtime (not at compile time) if this is wrong."
          } else {
            Write-Host "OK - found native interop DLL(s)."
          }

      - name: Build (Release | x86)
        run: msbuild "${{ env.SLN_PATH }}" /p:Configuration=Release /p:Platform=x86 /t:Rebuild /m

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "${{ env.ISS_PATH }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoStudioApp-Installer
          path: "**/installer/Output/PhotoStudioApp-Setup.exe"

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoStudioApp-Portable
          path: "**/PhotoStudioApp/bin/Release/**"
